# Optional: expose local Vite via Cloudflare Tunnel (private dev / demo)
#
# 1. Start the app:  npm run dev   (http://127.0.0.1:5173)
# 2. Run tunnel:     cloudflared tunnel --url http://127.0.0.1:5173
#
# Store credentials outside the repo, e.g. .cloudflare/credentials.json (add to .gitignore if needed).

tunnel: your-tunnel-name
credentials-file: .cloudflare/credentials.json

ingress:
  - hostname: your-subdomain.example.com
    service: http://127.0.0.1:5173
  - service: http_status:404
